application_name: OPC UA Metran900 Server
application_uri: urn:OPC UA Metran900 Server
product_uri: urn:OPC UA Metran900 Server toolkit
create_sample_keypair: true
certificate_path: own/cert.der
private_key_path: private/private.pem
certificate_validation:
  trust_client_certs: false
  check_time: true
pki_dir: ./pki
#discovery_server_url: opc.tcp://localhost:4840/UADiscovery
tcp_config:
  hello_timeout: 5
  host: 10.11.235.3
  port: 4840
limits:
  clients_can_modify_address_space: false
  max_subscriptions: 100
  max_monitored_items_per_sub: 1000
  max_monitored_item_queue_size: 10
  max_array_length: 1000
  max_string_length: 65535
  max_byte_string_length: 65535
  min_sampling_interval: 0.1
  min_publishing_interval: 0.1
  max_message_size: 327675
  max_chunk_count: 5
  send_buffer_size: 65535
  receive_buffer_size: 65535
performance:
  single_threaded_executor: false
locale_ids:
- en
user_tokens:
  sample_password_user:
    user: sample1
    pass: 123
discovery_urls:
- opc.tcp://10.11.235.3:4840/
default_endpoint: null
endpoints:
  none:
    path: /
    security_policy: None
    security_mode: None
    security_level: 0
    password_security_policy: null
    user_token_ids:
    - ANONYMOUS
    - sample_password_user
